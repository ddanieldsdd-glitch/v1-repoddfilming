        />
        <script>
            (function () {
                var p = location.pathname;
                if (p !== "/" && p !== "") {
                    document.getElementById("static-hero-poster")?.remove();
                    return;
                }
                var poster = document.getElementById("static-hero-poster");
                if (!poster) return;
                var remove = function () {
                    poster.remove();
                };
                window.addEventListener("scroll", remove, { once: true, passive: true });
                window.addEventListener("wheel", remove, { once: true, passive: true });
                window.addEventListener("touchmove", remove, { once: true, passive: true });
            })();
        </script>
